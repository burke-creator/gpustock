name: deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Allows a redeploy without an empty commit.
  workflow_dispatch:

# A newer push to main supersedes an in-flight deploy. PRs cancel their own
# earlier runs, but never cancel a main deploy.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Astro requires >=22.12.0.
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # On a pull request, prove the Worker still bundles and every binding
      # resolves, but do not touch production. `--dry-run` needs no
      # credentials, so this step also works on forks.
      - name: Verify bundle (pull request)
        if: github.event_name == 'pull_request'
        run: npx wrangler deploy --dry-run
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      # Secrets cannot be referenced directly in a step `if`, so presence is
      # resolved here first.
      - name: Check for deploy credentials
        id: creds
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CF_API_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      # `astro build` writes .wrangler/deploy/config.json, which points wrangler
      # at the generated dist/server/wrangler.json, so no -c flag is needed.
      - name: Deploy
        if: github.event_name != 'pull_request' && steps.creds.outputs.present == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      # Without this the workflow fails on every push until the token exists,
      # which just trains you to ignore failure mail. The build is still fully
      # verified above; only the deploy is withheld, and it is annotated on the
      # run so a green tick cannot be mistaken for "deployed".
      - name: Deploy skipped (no credentials)
        if: github.event_name != 'pull_request' && steps.creds.outputs.present != 'true'
        run: |
          echo "::warning title=Deploy skipped::CLOUDFLARE_API_TOKEN is not set in this repository. Build and typecheck passed, but nothing was deployed. Add it with: gh secret set CLOUDFLARE_API_TOKEN"
